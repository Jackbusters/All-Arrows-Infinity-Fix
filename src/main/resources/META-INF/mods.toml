# This is an example mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# See https://docs.minecraftforge.net/en/1.21.x/gettingstarted/modfiles/#modstoml
# There are lots of things you can do with the mods.toml, and not all fields are included with this MDK
# References: https://github.com/MinecraftForge/MDKExamples

modLoader="javafml"
loaderVersion="[65,)"
license="All Rights Reserved"
issueTrackerURL="https://www.curseforge.com/minecraft/mc-mods/all-arrows-infinity-fix/issues" #optional
#clientSideOnly=true #optional, default=false

[[mods]]
modId="allarrowsinfinityfix"
version="1.9"
displayName="All Arrows Infinity Fix"
#updateJSONURL="https://example.com/updates.json" #optional
displayURL="https://www.curseforge.com/minecraft/mc-mods/all-arrows-infinity-fix" #optional
#logoFile="examplemod.png" #optional
#credits="" #optional
authors="Jackbusters" #optional
#displayTest="MATCH_VERSION" #optional, default=MATCH_VERSION when not clientSideOnly, else IGNORE_ALL_VERSION

description='''Forces all arrows to be compatible with infinity.'''

[[dependencies.allarrowsinfinityfix]] #recommended
modId="forge"
mandatory=true
versionRange="[65,)"
ordering="NONE"
side="BOTH"

[[dependencies.allarrowsinfinityfix]] #recommended
modId="minecraft"
mandatory=true
versionRange="[26.1,26.2]"
ordering="NONE"
side="BOTH"


[modproperties.allarrowsinfinityfix]
catalogueItemIcon="minecraft:spectral_arrow"
# Features are specific properties of the game environment, that you may want to declare you require. This example declares
# that your mod requires GL version 3.2 or higher. Other features will be added. They are side aware so declaring this won't
# stop your mod loading on the server for example.
#[features.${mod_id}]
#openGLVersion="[3.2,)"
